# RiskPilot 消融实验配置: 禁用 GNN 字段
# 对比基线 (default.yaml) 来衡量 gnn_anomaly_score 的贡献

# ===== 数据集配置 =====
dataset:
  name: "tfinance"
  path: "dataset/"
  homo: true
  train_ratio: 0.4
  anomaly_alpha: null
  anomaly_std: null

# ===== Stage 1: GNN 感知层 (与基线一致) =====
gnn:
  model: "BWGNN"
  hidden_dim: 64
  order: 2
  epochs: 100
  learning_rate: 0.01
  device: "cpu"

  insight:
    top_k_anomaly: 500
    anomaly_threshold: 0.5
    n_clusters: 5
    k_hop: 2

# ===== Stage 2: LLM 策略层 (与基线一致) =====
llm:
  provider: "openai"
  model: "qwen-plus"
  temperature: 0.3
  max_tokens: 4096
  api_key_env: "OPENAI_API_KEY"
  base_url_env: "OPENAI_BASE_URL"

  rag:
    embedding_model: "text-embedding-3-small"
    top_k_retrieve: 5
    similarity_threshold: 0.7

  rule_gen:
    max_rules_per_round: 10
    max_optimization_rounds: 3

  # 消融标记: 禁用 GNN 字段
  ablation: "no_gnn"

# ===== Stage 3: 沙盒验证层 (与基线一致) =====
sandbox:
  thresholds:
    min_f1: 0.60
    min_recall: 0.50
    max_fpr: 0.05
    min_precision: 0.40
  backtest_ratio: 1.0

# ===== Stage 4: 规则知识库 =====
knowledge_base:
  vector_store: "chroma"
  persist_dir: "outputs_ablation_no_gnn/kb"
  collection_name: "risk_rules_ablation"

# ===== Pipeline =====
pipeline:
  max_iterations: 5
  output_dir: "outputs_ablation_no_gnn/"
  log_level: "INFO"
  ablation: "no_gnn"
